<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff5d73"><title>Launch Lisbon Quest Live</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fff8e6,#d8f8ff);font:700 16px system-ui;color:#18213a}.box{width:min(520px,calc(100% - 28px));background:#fff;border-radius:28px;padding:24px;box-shadow:0 20px 60px rgba(25,33,62,.18);text-align:center}h1{margin:0 0 8px;font-size:1.8rem}p{color:#66708b}.spinner{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:block;margin-top:14px;padding:14px;border-radius:16px;background:#ff5d73;color:#fff;text-decoration:none}</style></head><body><div class="box"><div class="spinner">🧭</div><h1>Loading tonight’s Lisbon Quest</h1><p>Clearing the old cached build, then opening the Rossio live route.</p><a id="manual" href="./?route=rossio-club&now=1&app=v11&fresh=1">Tap here if it does not open</a></div><script>(async()=>{const p=new URLSearchParams(location.search),allowed=new Set(['rossio-club','rossio-2h','rossio-3h','rossio-4h']),route=allowed.has(p.get('route'))?p.get('route'):'rossio-club';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('lisbon-quest-')).map(k=>caches.delete(k)))}}catch(e){}const u=new URL('./',location.href);u.searchParams.set('route',route);u.searchParams.set('now','1');u.searchParams.set('app','v11');u.searchParams.set('fresh','1');u.searchParams.set('_',Date.now());location.replace(u.href)})()</script></body></html>
