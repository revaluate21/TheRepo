<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff5c7a"><title>Opening Wander</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fff6c8,#d6f7ff);font:800 16px system-ui;color:#18213a}.card{width:min(480px,calc(100% - 30px));background:#fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(30,38,70,.18)}.mark{margin:auto;width:76px;height:76px;border-radius:26px;background:linear-gradient(135deg,#ff5c7a,#ff3fbc 55%,#7458ff);display:grid;place-items:center;color:#fff;font-size:42px;box-shadow:0 13px 35px rgba(255,63,188,.28)}h1{margin:17px 0 6px;font-size:2rem;letter-spacing:-.05em}p{margin:0;color:#69718b;font-weight:650}a{display:block;margin-top:18px;padding:14px;background:#ffb938;color:#211708;text-decoration:none;border-radius:17px}</style></head><body><div class="card"><div class="mark">W</div><h1>Opening Wander</h1><p>Refreshing the app shell, while keeping your saved walks and home point.</p><a href="./?app=v30#home">Tap if it does not open</a></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>n.includes('wander')||n.includes('lisbon-quest')).map(n=>caches.delete(n)))}}catch(e){}const u=new URL('./',location.href);u.searchParams.set('app','v30');u.searchParams.set('_',Date.now());u.hash='home';location.replace(u.href)})()</script></body></html>
