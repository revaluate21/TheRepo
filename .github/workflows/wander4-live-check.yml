name: Wander 4 public site acceptance
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander4-live-check.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Wait for the correct build on public HTTPS
        run: |
          python - <<'PY'
          import urllib.request,json,time
          root='https://revaluate21.github.io/TheRepo/wander4/'
          for attempt in range(24):
            try:
              sw=urllib.request.urlopen(root+'sw.js?verify='+str(time.time()),timeout=20).read().decode()
              assert "BUILD='4.0.3'" in sw
              j=json.load(urllib.request.urlopen(root+'catalog.json',timeout=20));assert len(j['routes'])==14
              assert urllib.request.urlopen(root+'connectivity.txt',timeout=20).status==200
              print('LIVE: expected build, 14 routes, connectivity endpoint',flush=True);break
            except Exception as e:
              print('Waiting for Pages',attempt,str(e),flush=True);time.sleep(10)
          else:raise SystemExit('Expected public build was not published')
          PY
      - name: Prepare real browser
        run: |
          python -m pip install --timeout 30 --retries 2 playwright
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || true)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if [ -z "$CHROME_PATH" ]; then python -m playwright install chromium; fi
      - name: Run all acceptance tests against the public site
        env:
          BASE_URL: https://revaluate21.github.io/TheRepo/wander4/
          SITE_ROOT: wander4
          QA_OUT: wander4-live-qa
        run: python scripts/wander4-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander4-public-acceptance
          path: wander4-live-qa/
          retention-days: 14
