name: Wander 5 live HTTPS and upgrade verification
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander5-production.yml']
permissions:
  contents: read
  actions: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33937169437
          name: wander4-final-app
          path: baseline
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Live build, offline reuse and old-install update
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/wander5-production-check.py')
          s=p.read_text()
          s=s.replace("shutil.rmtree(dest);shutil.copytree('wander4',dest)", "shutil.rmtree(dest);shutil.copytree('wander4',dest);time.sleep(1.1)\n  for f in dest.rglob('*'):\n   if f.is_file():f.touch()")
          start=s.index("  page.wait_for_function('document.querySelector")
          end=s.index("  check('v4 to v5 updates successfully'",start)
          replacement='''  page.wait_for_timeout(2000)
            print('UPGRADE_STATE',page.evaluate('async()=>({caches:await caches.keys(),registration:(await navigator.serviceWorker.getRegistration())?.active?.state})'),flush=True)
            for attempt in range(3):
             page.reload(wait_until='domcontentloaded')
             try:
              page.wait_for_function('window.Wander?.version===\"5.0.0\"',timeout=6000)
              break
             except Exception:
              print('REFRESH_RETRY',attempt,page.evaluate('window.Wander?.version'),flush=True)
              page.wait_for_timeout(2000)
          '''
          # Match the script's two-space try-block indentation.
          lines=replacement.splitlines()
          replacement=lines[0]+'\n'+'\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])+'\n'
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
          python scripts/wander5-production-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander5-production-verification
          path: qa-production/
          retention-days: 7
