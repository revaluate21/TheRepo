name: Wander v2 QA

on:
  push:
    branches: [gh-pages]
    paths:
      - 'wander/**'
      - '.github/workflows/wander-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save puppeteer-core@24
      - name: Start local site
        run: |
          python3 -m http.server 8080 >/tmp/wander-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/wander/ >/dev/null && break; sleep 1; done
      - name: Test installability, images, navigation and offline shell
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const cp = require('child_process');
          const paths = ['google-chrome-stable','google-chrome','chromium','chromium-browser'];
          const executablePath = paths.map(p=>{try{return cp.execSync(`which ${p}`).toString().trim()}catch{return ''}}).find(Boolean);
          if (!executablePath) throw new Error('Chrome/Chromium not found');
          const mockWeather = {
            current:{temperature_2m:31,apparent_temperature:33,weather_code:1,wind_speed_10m:18,is_day:1},
            daily:{
              time:['2026-09-04','2026-09-05','2026-09-06','2026-09-07','2026-09-08','2026-09-09'],
              weather_code:[1,1,2,1,3,1],temperature_2m_max:[34,32,29,30,27,28],temperature_2m_min:[21,20,19,19,18,18],
              sunrise:Array(6).fill('2026-09-04T07:10'),sunset:Array(6).fill('2026-09-04T20:05'),
              uv_index_max:[8,8,7,7,5,6],precipitation_probability_max:[2,4,10,5,30,8]
            }
          };
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=browser.defaultBrowserContext();
            await context.overridePermissions('http://127.0.0.1:8080',['geolocation']);
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            await page.setGeolocation({latitude:38.7223,longitude:-9.1393});
            await page.setRequestInterception(true);
            page.on('request',req=>req.url().includes('api.open-meteo.com')?req.respond({status:200,contentType:'application/json',body:JSON.stringify(mockWeather)}):req.continue());
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8080/wander/',{waitUntil:'networkidle0'});
            await page.waitForSelector('#nowGrid .now-card');
            const counts=await page.evaluate(()=>({now:document.querySelectorAll('#nowGrid .now-card').length,days:document.querySelectorAll('#fiveDayGrid .day-card').length,all:document.querySelectorAll('#allGrid .world-card').length}));
            if(counts.now!==6||counts.days!==5||counts.all<15)throw new Error(`Bad card counts ${JSON.stringify(counts)}`);
            await page.waitForFunction(()=>[...document.querySelectorAll('#nowGrid img')].every(i=>i.complete&&i.naturalWidth>0),{timeout:15000});
            await new Promise(r=>setTimeout(r,2200));
            const images=await page.evaluate(()=>[...document.querySelectorAll('#nowGrid img')].map(i=>({w:i.naturalWidth,h:i.naturalHeight,d:getComputedStyle(i).display})));
            if(images.some(i=>!i.w||!i.h||i.d==='none'))throw new Error(`Right-now image failed ${JSON.stringify(images)}`);
            await page.click('#nowGrid .now-card');await page.waitForSelector('#routeView:not(.hidden)');
            await page.waitForFunction(()=>{const i=document.querySelector('#stopPhoto');return i&&i.complete&&i.naturalWidth>0&&getComputedStyle(i).display!=='none'},{timeout:15000});
            const first=await page.evaluate(()=>({name:document.querySelector('#stopName').textContent,w:document.querySelector('#stopPhoto').naturalWidth,d:getComputedStyle(document.querySelector('#stopPhoto')).display}));
            await new Promise(r=>setTimeout(r,2200));
            const later=await page.evaluate(()=>({w:document.querySelector('#stopPhoto').naturalWidth,d:getComputedStyle(document.querySelector('#stopPhoto')).display}));
            if(!first.w||first.d==='none'||!later.w||later.d==='none')throw new Error(`Stop image did not persist ${JSON.stringify({first,later})}`);
            const sw=await page.evaluate(()=>navigator.serviceWorker.ready.then(r=>({scope:r.scope,active:!!r.active})));
            if(!sw.active||!sw.scope.endsWith('/wander/'))throw new Error(`Bad SW ${JSON.stringify(sw)}`);
            const client=await page.target().createCDPSession();
            const manifest=await client.send('Page.getAppManifest');
            if(!manifest.url.endsWith('/wander/manifest.webmanifest'))throw new Error(`Wrong manifest ${manifest.url}`);
            const install=await client.send('Page.getInstallabilityErrors');
            const fatal=(install.installabilityErrors||[]).filter(x=>!['no-manifest'].includes(x.errorId));
            if(fatal.length)throw new Error(`Installability errors ${JSON.stringify(fatal)}`);
            await page.goto('http://127.0.0.1:8080/wander/',{waitUntil:'networkidle0'});
            await page.setOfflineMode(true);await page.reload({waitUntil:'domcontentloaded'});await page.waitForSelector('#nowGrid .now-card');
            const offlineCount=await page.$$eval('#nowGrid .now-card',els=>els.length);if(offlineCount!==6)throw new Error('Offline shell failed');
            await page.screenshot({path:'wander-v2-mobile.png',fullPage:true});
            if(errors.length)throw new Error(`Console errors: ${errors.join(' | ')}`);
            console.log(JSON.stringify({counts,images,first,later,sw,manifest:manifest.url,offlineCount,installabilityErrors:install.installabilityErrors||[]},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander-v2-mobile-qa
          path: wander-v2-mobile.png
          if-no-files-found: ignore
