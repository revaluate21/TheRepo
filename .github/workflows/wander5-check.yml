name: Wander 5 full acceptance
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander5-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33954000588
          name: wander5-assets
          path: staging
      - run: python -m pip install Pillow playwright
      - name: Build the revised candidate
        run: python scripts/wander5-check-build.py
      - name: Check syntax
        run: |
          for f in staging/*.js; do node --check "$f"; done
          python -m py_compile scripts/qa-v5.py
      - run: python -m playwright install --with-deps chromium
      - name: Real browser acceptance
        run: |
          python -m http.server 8765 > /tmp/wander-server.log 2>&1 &
          python scripts/qa-v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander5-checked-app
          path: staging/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander5-checked-review
          path: |
            qa-v5/
            qa-repair/
          retention-days: 7
