name: Wander 4 release and browser acceptance
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander4-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: wander4-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: wander4-photos
          run-id: 33934651189
          github-token: ${{ github.token }}
          path: /tmp/wander-photos
      - uses: actions/download-artifact@v4
        with:
          name: wander4-geometry
          run-id: 33934715768
          github-token: ${{ github.token }}
          path: /tmp/wander-geometry
      - uses: actions/download-artifact@v4
        with:
          name: wander4-photo-review
          run-id: 33935347501
          github-token: ${{ github.token }}
          path: /tmp/wander-review
      - uses: actions/download-artifact@v4
        with:
          name: wander4-estoril-photo
          run-id: 33935768597
          github-token: ${{ github.token }}
          path: /tmp/wander-estoril
      - run: python -m pip install playwright pillow cairosvg
      - name: Verify and assemble source and manually chosen photographs
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,shutil,cairosvg
          parts=sorted(Path('scripts/wander4-release').glob('part-*.b64'))
          assert len(parts)==8, len(parts)
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='0913f838538f19411ceca3ed65e70d38f8344bf21a8e9db547b629730273d965','Source bundle checksum mismatch'
          files=json.loads(lzma.decompress(raw))
          for name,text in files.items():
              assert '..' not in Path(name).parts and (name.startswith('wander4/') or name=='scripts/wander4-qa.py')
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          for folder in ['photos','vendor']:
              shutil.copytree(Path('/tmp/wander-photos')/folder,Path('wander4')/folder,dirs_exist_ok=True)
          shutil.copy('/tmp/wander-geometry/geometry.json','wander4/geometry.json')
          selected={'obidos-gate':'obidos-gate-0','mouchao':'mouchao-4','evora-se':'evora-se-1','tower-vg':'tower-vg-4','pena':'pena-2','ribeira':'ribeira-1'}
          for dest,src in selected.items():
              for suffix in ['.webp','-thumb.webp']:shutil.copy('/tmp/wander-review/'+src+suffix,'wander4/photos/'+dest+suffix)
          for suffix in ['.webp','-thumb.webp']:shutil.copy('/tmp/wander-estoril/tamariz'+suffix,'wander4/photos/tamariz'+suffix)
          Path('wander4/icons').mkdir(exist_ok=True)
          for size in [192,512]:cairosvg.svg2png(url='wander4/icon.svg',write_to=f'wander4/icons/icon-{size}.png',output_width=size,output_height=size)
          shutil.copy('wander4/icons/icon-512.png','wander4/icons/icon-maskable.png')
          photos=json.loads(Path('wander4/photos.json').read_text())
          for key,m in photos.items():
              assert Path('wander4',m['src']).exists(),key
              if 'sha256' in m:assert hashlib.sha256(Path('wander4',m['src']).read_bytes()).hexdigest()==m['sha256'],key
          print('Assembled',len(files),'source files;',len(photos),'unique credited photographs')
          PY
      - run: |
          node --check wander4/app.js
          node --check wander4/logic.js
          node --check wander4/sw.js
          python -m playwright install --with-deps chromium
      - name: Full mobile and offline acceptance tests
        run: |
          python -m http.server 8765 > /tmp/wander4-server.log 2>&1 &
          sleep 2
          python scripts/wander4-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander4-browser-acceptance
          path: wander4-qa/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander4-built-app
          path: wander4/
          retention-days: 7
      - name: Publish only after all acceptance tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wander4 scripts/wander4-qa.py
          git commit -m 'Release Wander 4: real photographs, street routes and phone-down navigation'
          git push origin HEAD:gh-pages
