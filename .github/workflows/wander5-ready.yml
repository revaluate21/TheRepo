name: Wander 5 ready for release
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander5-ready.yml']
permissions:
  contents: read
  actions: read
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33955239712
          name: wander5-checked-app
          path: staging
      - run: python -m pip install playwright
      - run: python scripts/wander5-ready.py
      - name: Syntax checks
        run: |
          for f in staging/*.js; do node --check "$f"; done
          python -m py_compile scripts/qa-v5.py scripts/wander5-map-check.py
      - run: python -m playwright install --with-deps chromium
      - name: Complete browser acceptance
        run: |
          python -m http.server 8765 > /tmp/wander-server.log 2>&1 &
          python scripts/qa-v5.py
      - name: Single representative actual map and visual check
        if: always()
        run: python scripts/wander5-map-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander5-release-candidate
          path: staging/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander5-final-review
          path: |
            qa-v5/
            qa-map/
          retention-days: 7
