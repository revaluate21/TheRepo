name: Deploy Wander v2 package

on:
  push:
    branches: [gh-pages]
    paths: ['wander-v2-package.b64']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Extract tested application package
        run: |
          base64 --decode wander-v2-package.b64 > /tmp/wander-v2.tar.gz
          tar -xzf /tmp/wander-v2.tar.gz -C .
          rm -f wander-v2-package.b64 .github/workflows/deploy-wander-v2.yml
      - name: Publish application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy stable Wander Portugal v2"
          git push origin HEAD:gh-pages
