name: Replace Wander placeholders with real photographs

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/replace-wander-real-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wander-real-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download, crop and validate 28 real photographs
        run: |
          cat > /tmp/fetch_real_photos.py <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import io
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from difflib import SequenceMatcher

          from PIL import Image, ImageDraw, ImageFont, ImageOps, ImageStat

          API = 'https://commons.wikimedia.org/w/api.php'
          UA = 'WanderPortugal/2.0 (photo bundle for an open travel PWA; contact via github.com/revaluate21/TheRepo)'
          OUT = Path('assets/photos')
          OUT.mkdir(parents=True, exist_ok=True)

          ITEMS = {
              'belem.jpg': ('Belém Tower (Torre de Belém) 1.jpg', 'Belém Tower Lisbon exterior'),
              'bica.jpg': ('Elevador da Bica - Lisbon (52750990701).jpg', 'Elevador da Bica Lisbon street'),
              'boca-vento.jpg': ('Elevador da Boca do Vento, Almada - panoramio.jpg', 'Boca do Vento Almada Lisbon view'),
              'boca.jpg': ('Boca do Inferno, Cascais.jpg', 'Boca do Inferno Cascais cliffs'),
              'cais.jpg': ('Cais do Sodre, Lisbon (DSC03382).jpg', 'Cais do Sodré Lisbon'),
              'carmo.jpg': ('Lisbon, the Convento do Carmo.JPG', 'Convento do Carmo Lisbon ruins'),
              'coimbra.jpg': ('Portugal 120716 Coimbra University 07.jpg', 'University of Coimbra courtyard'),
              'cristo.jpg': ('Cristo Rei, Almada 39.jpg', 'Cristo Rei Almada Lisbon view'),
              'evora.jpg': ('Roman-Temple-Evora.jpg', 'Roman Temple Évora Portugal'),
              'graca.jpg': ('Miradouro da Graça.jpg', 'Miradouro da Graça Lisbon'),
              'guincho.jpg': ('Praia do Guincho (cropped).JPG', 'Praia do Guincho Cascais Atlantic'),
              'joanina.jpg': ('Biblioteca Joanina (53560470042).jpg', 'Biblioteca Joanina Coimbra'),
              'maat.jpg': ('MAAT - The Museum of Art, Architecture and Technology (33806654791).jpg', 'MAAT Lisbon exterior'),
              'monserrate.jpg': ('The Palace of Monserrate in Sintra National Park (27954800241).jpg', 'Monserrate Palace Sintra garden'),
              'mouros.jpg': ('The Moorish Castle, Sintra, Portugal (27954846141).jpg', 'Moorish Castle Sintra walls'),
              'obidos.jpg': ("The Óbidos' Castle (4017081137).jpg", 'Óbidos castle walls Portugal'),
              'oriente.jpg': ('Gare do Oriente.jpg', 'Gare do Oriente Lisbon architecture'),
              'parque.jpg': ('Parque Eduardo VII - Lisbon (52750120427).jpg', 'Parque Eduardo VII Lisbon view'),
              'pena.jpg': ('Pena Palace, Sintra, Portugal, 20250606 1019 9978.jpg', 'Pena Palace Sintra colourful exterior'),
              'pink.jpg': ('Lisbon Pink Street.jpg', 'Pink Street Lisbon Rua Nova do Carvalho'),
              'praca.jpg': ('Praça do Comércio – Lisboa, Portugal (54817271215).jpg', 'Praça do Comércio Lisbon square'),
              'regaleira.jpg': ('Quinta da Regaleira 01.jpg', 'Quinta da Regaleira Sintra palace'),
              'rossio.jpg': ('Rossio Square Lisbon Portugal.jpg', 'Rossio Square Lisbon'),
              'santa-luzia.jpg': ('St. Lucy - Miradouro de Santa Luzia - Lisbon (52751066335).jpg', 'Miradouro Santa Luzia Lisbon tiles'),
              'sao-pedro.jpg': ('Miradouro de São Pedro de Alcântara (13943471369).jpg', 'São Pedro de Alcântara Lisbon viewpoint'),
              'se.jpg': ('Sé de Lisboa (Lisbon Cathedral) 112.jpg', 'Lisbon Cathedral Sé exterior'),
              'senhora.jpg': ('Miradouro da Senhora do Monte (38530147244).jpg', 'Senhora do Monte Lisbon viewpoint'),
              'tomar.jpg': ('Convent of Christ - Tomar.jpg', 'Convent of Christ Tomar Portugal'),
          }

          def request_json(params: dict) -> dict:
              url = API + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)

          def request_bytes(url: str) -> bytes:
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'image/avif,image/webp,image/*,*/*;q=0.8'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
                  if len(data) < 50_000:
                      raise RuntimeError(f'image download was unexpectedly small ({len(data)} bytes)')
                  return data

          def strip_markup(value: str | None) -> str:
              text = html.unescape(value or '')
              text = re.sub(r'<br\s*/?>', ' ', text, flags=re.I)
              text = re.sub(r'<[^>]+>', '', text)
              return re.sub(r'\s+', ' ', text).strip()

          def title_similarity(candidate: str, wanted: str, query: str) -> float:
              c = candidate.removeprefix('File:').lower()
              w = wanted.lower()
              q_words = {x for x in re.findall(r'[\wÀ-ÿ]+', query.lower()) if len(x) > 3}
              overlap = sum(1 for word in q_words if word in c)
              return SequenceMatcher(None, c, w).ratio() + overlap * .09

          def image_info(title: str, query: str) -> tuple[dict, dict]:
              base = {
                  'action':'query','format':'json','formatversion':'2','redirects':'1',
                  'prop':'imageinfo','iiprop':'url|extmetadata|size|mime','iiurlwidth':'1800',
              }
              exact = request_json({**base, 'titles':'File:' + title})
              pages = exact.get('query', {}).get('pages', [])
              if pages and not pages[0].get('missing') and pages[0].get('imageinfo'):
                  return pages[0], pages[0]['imageinfo'][0]

              search = request_json({
                  **base, 'generator':'search', 'gsrsearch':query, 'gsrnamespace':'6',
                  'gsrlimit':'20', 'gsrwhat':'text'
              })
              candidates = []
              for page in search.get('query', {}).get('pages', []):
                  infos = page.get('imageinfo') or []
                  if not infos: continue
                  info = infos[0]
                  if info.get('mime') not in ('image/jpeg','image/png','image/webp'): continue
                  if min(info.get('width',0), info.get('height',0)) < 700: continue
                  candidates.append((title_similarity(page.get('title',''), title, query), page, info))
              if not candidates:
                  raise RuntimeError(f'No usable Wikimedia Commons result for {title!r}')
              _, page, info = max(candidates, key=lambda item: item[0])
              return page, info

          def crop_photo(raw: bytes, asset: str) -> tuple[Image.Image, dict]:
              with Image.open(io.BytesIO(raw)) as source:
                  source = ImageOps.exif_transpose(source).convert('RGB')
                  original = source.size
                  image = ImageOps.fit(source, (1280, 800), method=Image.Resampling.LANCZOS, centering=(.5,.5))
              gray = image.resize((160,100)).convert('L')
              stat = ImageStat.Stat(gray)
              entropy = gray.entropy()
              std = stat.stddev[0]
              extrema = gray.getextrema()
              if std < 18 or entropy < 4.4 or extrema[1] - extrema[0] < 75:
                  raise RuntimeError(f'{asset} failed photographic-detail check: std={std:.1f}, entropy={entropy:.2f}, range={extrema}')
              return image, {'original': original, 'stddev': round(std,2), 'entropy': round(entropy,3), 'range': list(extrema)}

          credits = []
          status = {'real_photo_bundle': True, 'generated_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), 'photos': {}}
          thumbs = []

          for asset, (wanted, query) in ITEMS.items():
              print(f'Fetching {asset}: {wanted}')
              page, info = image_info(wanted, query)
              raw = request_bytes(info.get('thumburl') or info['url'])
              image, metrics = crop_photo(raw, asset)
              output = OUT / asset
              image.save(output, 'JPEG', quality=88, optimize=True, progressive=True, subsampling=1)
              digest = hashlib.sha256(output.read_bytes()).hexdigest()
              meta = info.get('extmetadata') or {}
              actual_title = page.get('title','File:' + wanted).removeprefix('File:')
              author = strip_markup((meta.get('Artist') or {}).get('value')) or 'Wikimedia Commons contributor'
              license_name = strip_markup((meta.get('LicenseShortName') or {}).get('value')) or strip_markup((meta.get('UsageTerms') or {}).get('value')) or 'See source page'
              source = 'https://commons.wikimedia.org/wiki/File:' + urllib.parse.quote(actual_title.replace(' ', '_'), safe="()_',-–")
              credits.append({'asset':asset,'title':actual_title,'author':author,'license':license_name,'source':source})
              status['photos'][asset] = {'title':actual_title,'bytes':output.stat().st_size,'sha256':digest,**metrics}
              thumb = image.copy().resize((320,200), Image.Resampling.LANCZOS)
              thumbs.append((asset,thumb))
              time.sleep(.25)

          Path('wander/photo-credits.json').write_text(json.dumps(credits, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('wander/photo-status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')

          rows=[]
          for c in credits:
              rows.append(f'<li><b>{html.escape(c["asset"])}</b> — <a href="{html.escape(c["source"])}">{html.escape(c["title"])}</a>, {html.escape(c["author"])}, {html.escape(c["license"])}</li>')
          page_html = '''<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wander photo credits</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:24px;line-height:1.55;background:#fffdf7;color:#161b35}a{color:#6847e8}li{margin:10px 0}</style><h1>Wander Portugal — photograph credits</h1><p>Photographs were resized and centre-cropped for the app. Follow each source for the original file and full licence details.</p><ol>''' + ''.join(rows) + '</ol>'
          Path('wander/photo-credits.html').write_text(page_html, encoding='utf-8')

          contact = Image.new('RGB',(5*320,6*235),'white')
          draw=ImageDraw.Draw(contact)
          font=ImageFont.load_default(size=18)
          for i,(asset,thumb) in enumerate(thumbs):
              x=(i%5)*320;y=(i//5)*235
              contact.paste(thumb,(x,y));draw.rectangle((x,y+200,x+320,y+235),fill=(255,255,255));draw.text((x+8,y+207),asset,fill=(20,25,45),font=font)
          contact.save('/tmp/wander-real-photo-contact-sheet.jpg','JPEG',quality=88,optimize=True)
          print(json.dumps(status, indent=2))
          PY
          python /tmp/fetch_real_photos.py
      - name: Verify every file is a detailed real photograph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageStat
          status=json.loads(Path('wander/photo-status.json').read_text())
          assert status['real_photo_bundle'] is True
          files=sorted(Path('assets/photos').glob('*.jpg'))
          assert len(files)==28, len(files)
          for path in files:
              with Image.open(path) as im:
                  assert im.size==(1280,800), (path,im.size)
                  gray=im.resize((160,100)).convert('L')
                  assert ImageStat.Stat(gray).stddev[0] >= 18, path
                  assert gray.entropy() >= 4.4, path
              assert path.stat().st_size > 80_000, (path,path.stat().st_size)
          print('Verified',len(files),'real photographic assets')
          PY
      - name: Commit real photograph bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos wander/photo-credits.json wander/photo-credits.html wander/photo-status.json
          if git diff --cached --quiet; then
            echo 'No photograph changes to commit.'
          else
            git commit -m 'Replace Wander placeholders with verified real photographs'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wander-real-photo-contact-sheet
          path: /tmp/wander-real-photo-contact-sheet.jpg
          retention-days: 7
