name: One-time arrival confidence fix

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/fix-arrival.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Patch high-confidence arrival detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()
          old = """      if (d <= threshold && next.acc <= 100) state.arrivalHits += 1; else state.arrivalHits = 0;
                if (state.arrivalHits >= 2 && !state.arrived) {
                  state.arrived = true;
                  if (state.haptics) navigator.vibrate?.([160, 70, 80]);
                  speak(`You are at ${stop.name}.`);
                  toast(`Arrived: ${stop.name}`, 3600);
                }
          """
          # Exact source indentation is six spaces, not the visual indentation above.
          old = old.replace('                ', '      ')
          new = """      const highConfidenceArrival = next.acc <= 30 && d <= Math.max(24, next.acc * 1.25);
                if (d <= threshold && next.acc <= 100) state.arrivalHits += 1; else state.arrivalHits = 0;
                if ((highConfidenceArrival || state.arrivalHits >= 2) && !state.arrived) {
                  state.arrived = true;
                  if (state.haptics) navigator.vibrate?.([160, 70, 80]);
                  speak(`You are at ${stop.name}.`);
                  toast(`Arrived: ${stop.name}`, 3600);
                }
          """
          new = new.replace('                ', '      ')
          if old not in text:
              raise SystemExit('Arrival block not found')
          path.write_text(text.replace(old, new))
          PY
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Make precise checkpoint arrivals immediate'
          git push origin gh-pages
