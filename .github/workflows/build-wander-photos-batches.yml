name: Build Wander real photographs in four fresh batches

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/build-wander-photos-batches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wander-photo-batches
  cancel-in-progress: false

jobs:
  batch-1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and validate photographs 1–7
        run: python tools/build_wander_photos.py --batch 0
      - name: Commit batch 1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos wander/photo-credits.json wander/photo-status.json
          git commit -m 'Add Wander real photographs batch 1 of 4'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

  batch-2:
    needs: batch-1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Ensure latest completed batch is checked out
        run: git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and validate photographs 8–14
        run: python tools/build_wander_photos.py --batch 1
      - name: Commit batch 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos wander/photo-credits.json wander/photo-status.json
          git commit -m 'Add Wander real photographs batch 2 of 4'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

  batch-3:
    needs: batch-2
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Ensure latest completed batch is checked out
        run: git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and validate photographs 15–21
        run: python tools/build_wander_photos.py --batch 2
      - name: Commit batch 3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos wander/photo-credits.json wander/photo-status.json
          git commit -m 'Add Wander real photographs batch 3 of 4'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

  batch-4-and-finalise:
    needs: batch-3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Ensure latest completed batch is checked out
        run: git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and validate photographs 22–28
        run: python tools/build_wander_photos.py --batch 3
      - name: Validate the complete local photograph library
        run: python tools/build_wander_photos.py --finalise
      - name: Commit completed photograph library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos wander/photo-credits.json wander/photo-credits.html wander/photo-status.json
          git commit -m 'Complete Wander library with 28 verified real photographs'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        with:
          name: wander-real-photo-contact-sheet
          path: /tmp/wander-real-photo-contact-sheet.jpg
          retention-days: 7
