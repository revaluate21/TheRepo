name: Wander 4 photograph build
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/wander4-assets.yml']
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/wander4-photos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wander4-photos
          path: wander4-stage/
          retention-days: 3
