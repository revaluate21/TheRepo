name: Fetch licensed route photos

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - photo-sources.txt
      - scripts/fetch_photos.py
      - .github/workflows/fetch-photos.yml

permissions:
  contents: write

concurrency:
  group: wander-photo-bundle
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download and optimise credited photographs
        run: python scripts/fetch_photos.py
      - name: Verify all photographs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('photo-status.json').read_text())
          assert status['ok'] is True
          assert status['count'] == status['expected'] == 28
          for photo in status['photos']:
              path = Path(photo['path'])
              assert path.exists(), path
              assert path.stat().st_size > 25_000, path
          print('Verified', status['count'], 'real photos')
          PY
      - name: Commit the local photo bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos assets/icon-192.png assets/icon-512.png photo-status.json
          if git diff --cached --quiet; then
            echo 'Photo bundle is already current.'
          else
            git commit -m 'Bundle credited route photographs'
            git push origin gh-pages
          fi
