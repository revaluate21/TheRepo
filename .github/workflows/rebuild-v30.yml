name: One-time Wander v30 rebuild

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/rebuild-v30.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Decode and replace app files
        shell: bash
        run: |
          set -euo pipefail
          cat .wander/payload-* > /tmp/wander.b64
          base64 --decode /tmp/wander.b64 > /tmp/wander.tar.gz
          mkdir -p /tmp/wander-src
          tar -xzf /tmp/wander.tar.gz -C /tmp/wander-src
          rm -rf /tmp/wander-src/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/wander-src/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Wander Portugal v30 from scratch'
          git push origin gh-pages
