[project]
name = "prediction-suite"
version = "0.1.0"
description = "Local-first Polymarket + Kalshi research and execution suite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "feedparser>=6.0",
  "websockets>=12.0",
  "orjson>=3.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.optional-dependencies]
live = [
  "py-clob-client>=0.22",
  "eth-account>=0.11",
  "tweepy>=4.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
