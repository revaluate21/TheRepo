<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff665f"><title>Launching Lisbon Quest</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0,#ffe39a,transparent 40%),linear-gradient(145deg,#fff8eb,#dff8ff);font:700 16px system-ui;color:#17213b}.box{width:min(520px,calc(100% - 28px));padding:25px;background:#fff;border-radius:28px;box-shadow:0 22px 65px rgba(23,33,59,.18);text-align:center}.icon{font-size:46px;animation:b 1.1s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(-8px) rotate(4deg)}}h1{margin:5px 0 8px;font-size:1.75rem}p{color:#66708a}a{display:block;margin-top:15px;padding:14px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#ff665f,#ff3fb5);text-decoration:none}</style></head><body><div class="box"><div class="icon">🗺️</div><h1>Opening the rebuilt Lisbon Quest</h1><p>Clearing the old compass-arrow version, then loading the Day & Night navigator.</p><a id="manual" href="./?revamp=v13&route=day-replay&world=day">Open manually</a></div><script>(async()=>{const p=new URLSearchParams(location.search);const route=p.get('route')||'day-replay';const world=p.get('world')||'day';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('lisbon-quest-')).map(k=>caches.delete(k)))}}catch(e){}const u=new URL('./',location.href);u.searchParams.set('revamp','v13');u.searchParams.set('route',route);u.searchParams.set('world',world);u.searchParams.set('_',Date.now());location.replace(u.href)})()</script></body></html>
